<svg xmlns="http://www.w3.org/2000/svg" width="482" height="238" viewBox="0 0 482 238">
  <!-- Pickleboy Glacier backup — write-path architecture. 1 unit = 1 pt. -->
  <rect x="0" y="0" width="482" height="238" fill="#ffffff"/>

  <!-- dashed additive-only boundary around rclone + IAM + bucket -->
  <rect x="152" y="8" width="326" height="172" rx="4" fill="none"
        stroke="#2e5570" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="164" y="192" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="7.5" font-weight="600" fill="#2e5570">additive-only write path — nothing inside this boundary holds a delete permission</text>

  <!-- Box A: media library -->
  <rect x="2" y="22" width="126" height="62" fill="#ffffff" stroke="#cfd6db" stroke-width="0.75"/>
  <text x="10" y="36" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="8" font-weight="600" fill="#1a1d21">Media library</text>
  <text x="10" y="48" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#1a1d21">/mnt/media/STORAGE</text>
  <text x="10" y="59" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="7" fill="#4a5157">8TB WD Elements, NTFS, USB</text>
  <text x="10" y="70" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#4a5157">MOVIES 3.29 · SHOWS 1.73 TiB</text>
  <text x="10" y="79" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#4a5157">13,929 files</text>

  <!-- arrow A -> B -->
  <line x1="128" y1="53" x2="156" y2="53" stroke="#4a5157" stroke-width="1"/>
  <path d="M 156 53 l -5 -3 l 0 6 z" fill="#4a5157"/>

  <!-- Box B: rclone -->
  <rect x="162" y="22" width="138" height="62" fill="#ffffff" stroke="#cfd6db" stroke-width="0.75"/>
  <text x="170" y="36" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="8" font-weight="600" fill="#1a1d21">rclone 1.75.0</text>
  <text x="170" y="48" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="7" fill="#4a5157">copy — additive, never mirror</text>
  <text x="170" y="59" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#1a1d21">--size-only · chunk_size 64M</text>
  <text x="170" y="70" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#1a1d21">storage_class DEEP_ARCHIVE</text>
  <text x="170" y="79" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#4a5157">no acl line — see ch. 5</text>

  <!-- arrow B -> C -->
  <line x1="300" y1="53" x2="328" y2="53" stroke="#4a5157" stroke-width="1"/>
  <path d="M 328 53 l -5 -3 l 0 6 z" fill="#4a5157"/>

  <!-- Box C: bucket -->
  <rect x="334" y="22" width="136" height="62" fill="#ffffff" stroke="#cfd6db" stroke-width="0.75"/>
  <text x="342" y="36" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="8" font-weight="600" fill="#1a1d21">S3 bucket — us-west-2</text>
  <text x="342" y="47" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#1a1d21">s3-glacier-test-</text>
  <text x="342" y="56" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#1a1d21">123456789012-us-west-2-an</text>
  <text x="342" y="67" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="7" fill="#4a5157">versioned · SSE-S3 · no public access</text>
  <rect x="342" y="71" width="66" height="10" fill="#e3ebf1"/>
  <text x="346" y="78.5" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" font-weight="500" fill="#2e5570">DEEP_ARCHIVE</text>

  <!-- credential line rclone -> IAM -->
  <line x1="231" y1="84" x2="231" y2="102" stroke="#4a5157" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="237" y="97" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="6.8" fill="#4a5157">runs as</text>

  <!-- Box D: IAM user -->
  <rect x="162" y="102" width="200" height="70" fill="#ffffff" stroke="#cfd6db" stroke-width="0.75"/>
  <text x="170" y="116" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="8" font-weight="600" fill="#1a1d21">IAM user pickleboy</text>
  <text x="288" y="116" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="6.8" fill="#4a5157">profile pickleboy-backup</text>

  <!-- granted -->
  <path d="M 172 124 l 2.5 3 l 4.5 -6" fill="none" stroke="#2f6b4a" stroke-width="1.4"/>
  <text x="184" y="129" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="7" fill="#2f6b4a">ListBucket · PutObject · GetObject</text>
  <path d="M 172 136 l 2.5 3 l 4.5 -6" fill="none" stroke="#2f6b4a" stroke-width="1.4"/>
  <text x="184" y="141" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="7" fill="#2f6b4a">RestoreObject · multipart set</text>
  <!-- not granted -->
  <path d="M 172 148 l 6 6 M 178 148 l -6 6" stroke="#9c3f2c" stroke-width="1.4"/>
  <text x="184" y="154" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace"
        font-size="7" fill="#9c3f2c">Delete* — nothing, by design</text>
  <text x="184" y="165" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="6.8" fill="#4a5157">a stolen key can add junk; it cannot erase history</text>

  <!-- admin side note -->
  <rect x="2" y="206" width="300" height="26" fill="none" stroke="#cfd6db"
        stroke-width="0.75" stroke-dasharray="3 3"/>
  <text x="10" y="217" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="7" fill="#4a5157">separate admin identity (SSO, AdministratorAccess): bucket creation and</text>
  <text x="10" y="227" font-family="IBM Plex Sans, DejaVu Sans, sans-serif"
        font-size="7" fill="#4a5157">versioning setup only — the backup scripts never touch it</text>
</svg>
